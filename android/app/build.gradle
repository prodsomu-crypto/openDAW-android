plugins {
    id "com.android.application"
}

android {
    namespace "org.opendaw.studio"
    compileSdk 36

    defaultConfig {
        applicationId "org.opendaw.studio"
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName "0.1.0"
    }

    buildTypes {
        debug {
            applicationIdSuffix ".debug"
            versionNameSuffix "-debug"
        }
        release {
            minifyEnabled false
            // Stable release signing will be added through protected GitHub Actions secrets.
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    packaging {
        resources {
            excludes += ["/META-INF/{AL2.0,LGPL2.1}"]
        }
    }
}

dependencies {
    implementation "androidx.webkit:webkit:1.18.0"
}
